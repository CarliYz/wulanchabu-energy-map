name: Current workbench checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: npm ci
      - run: python -m pip install -r requirements-contracts.txt
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/refresh_runtime_audit.py
      - run: python scripts/verify_public_release.py
      - run: python scripts/validate_integrated_model.py --output /tmp/model-validation.json
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/agent-e2e/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: qa/agent-e2e
      - run: npx playwright install --with-deps chromium
        working-directory: qa/agent-e2e
      - run: npm run qa:current
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: current-workbench-e2e
          path: qa/agent-e2e/.e2e-m16
          include-hidden-files: true
